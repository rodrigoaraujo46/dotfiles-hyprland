general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on", monitor = "HDMI-A-1"})' && brightnessctl -r
}

listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off", monitor = "HDMI-A-1"})' && brightnessctl set 0
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on", monitor = "HDMI-A-1"})' && brightnessctl -r
}
